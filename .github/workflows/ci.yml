name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install api deps
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: ruff
        working-directory: apps/api
        run: ruff check .
      - name: pytest
        working-directory: apps/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      # NOTE: `npm run build` is currently blocked by a Next 14.2 /
      # NextAuth interaction that fails to prerender the legacy /_error
      # fallbacks (/404, /500). The dev server (`next dev`) and the
      # prod server (`next start`) both work. Tracked as a follow-up.
