name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsu
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: rsu_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsu -d rsu_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rsu:ci-password@localhost:5432/rsu_dashboard
      DATABASE_URL_SYNC: postgresql+psycopg://rsu:ci-password@localhost:5432/rsu_dashboard
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install api deps
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: ruff
        working-directory: apps/api
        run: ruff check .
      - name: Migrate test database
        working-directory: apps/api
        run: alembic upgrade head
      - name: pytest
        working-directory: apps/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        env:
          NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          NEXTAUTH_URL: http://localhost:3100
          API_URL_INTERNAL: http://api:8000
          NEXT_PUBLIC_API_URL: http://localhost:8100
        run: npm run build
