services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/storage
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PREFIX: ${GCS_PREFIX:-rsu-dashboard}
      REPORT_WORKER_POLL_SECONDS: ${REPORT_WORKER_POLL_SECONDS:-2}
      ANALYTICS_LOCAL_PATH: /data/analytics
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-900}
      ANALYTICS_CACHE_MAX_ENTRIES: ${ANALYTICS_CACHE_MAX_ENTRIES:-512}
      ANALYTICS_CACHE_MAX_BYTES: ${ANALYTICS_CACHE_MAX_BYTES:-67108864}
      ANALYTICS_QUERY_TIMEOUT_SECONDS: ${ANALYTICS_QUERY_TIMEOUT_SECONDS:-60}
    volumes:
      - uploads:/data/uploads
      - storage:/data/storage
      - analytics:/data/analytics:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "reports.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/storage
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_PREFIX: ${GCS_PREFIX:-rsu-dashboard}
      REPORT_WORKER_POLL_SECONDS: ${REPORT_WORKER_POLL_SECONDS:-2}
    volumes:
      - uploads:/data/uploads
      - storage:/data/storage

  analytics-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "data_platform.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ANALYTICS_SOURCE_PATH: /data/rsu-source
      ANALYTICS_LOCAL_PATH: /data/analytics
      ANALYTICS_PIPELINE_VERSION: ${ANALYTICS_PIPELINE_VERSION:-rsu-duckdb-v1}
      ANALYTICS_MEMORY_LIMIT: ${ANALYTICS_MEMORY_LIMIT:-4GB}
      ANALYTICS_THREADS: ${ANALYTICS_THREADS:-4}
      ANALYTICS_TEMP_DIRECTORY: /data/analytics/tmp
      ANALYTICS_MAX_TEMP_DIRECTORY_SIZE: ${ANALYTICS_MAX_TEMP_DIRECTORY_SIZE:-20GB}
      ANALYTICS_WORKER_POLL_SECONDS: ${ANALYTICS_WORKER_POLL_SECONDS:-2}
    volumes:
      - analytics:/data/analytics
      - ./data/julia-rsu/raw:/data/rsu-source:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      API_URL_INTERNAL: ${API_URL_INTERNAL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PDF_RENDER_BASE_URL: ${PDF_RENDER_BASE_URL:-http://web:3000}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3100}:3000"

volumes:
  dbdata:
  uploads:
  storage:
  analytics:
