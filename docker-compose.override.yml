services:
  db:
    ports:
      - "${DB_PORT:-5433}:5432"

  api:
    build:
      target: api-builder
    command: ["/app/entrypoint.sh"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      UVICORN_EXTRA: "--reload"
    volumes:
      - ./apps/api:/app
      - ./data/uploads:/data/uploads
      - ./data/storage:/data/storage
      - ./data/analytics:/data/analytics:ro
    ports:
      - "${API_PORT:-8100}:8000"

  worker:
    build:
      target: api-builder
    entrypoint: ["python", "-m", "reports.worker"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/api:/app
      - ./data/uploads:/data/uploads
      - ./data/storage:/data/storage

  analytics-worker:
    build:
      target: api-builder
    entrypoint: ["python", "-m", "data_platform.worker"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/api:/app
      - ./data/julia-rsu/raw:/data/rsu-source:ro
      - ./data/analytics:/data/analytics

  web:
    build:
      target: web-builder
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
