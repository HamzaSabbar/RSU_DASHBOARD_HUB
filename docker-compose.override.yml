services:
  api:
    build:
      target: builder
    command: ["/app/entrypoint.sh"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      UVICORN_EXTRA: "--reload"
    volumes:
      - ./apps/api:/app
      - ./data/uploads:/data/uploads
      - ./data/storage:/data/storage

  worker:
    build:
      target: builder
    entrypoint: ["python", "-m", "reports.worker"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/api:/app
      - ./data/uploads:/data/uploads
      - ./data/storage:/data/storage

  web:
    build:
      target: builder
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
